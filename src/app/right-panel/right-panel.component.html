<div class="right-panel-container" [style.display]="activePanel ? 'flex' : 'none'" [style.width]="panelWidth">
  <div class="panel-header" (mousedown)="startResize($event)">
    <div class="drag-handle"></div>
  </div>
  
  <div class="panel-content" *ngIf="activePanel">
    <app-collaborator *ngIf="activePanel === 'collaborator'" [mode]="collaboratorMode"></app-collaborator>
    <app-chat *ngIf="activePanel === 'chat'"></app-chat>
    <app-video-call *ngIf="activePanel === 'video'"></app-video-call>
    <app-ai-panel *ngIf="activePanel === 'ai'"></app-ai-panel>
  </div>
</div>

<div class="collaboration-toolbar">
  <ng-container *ngFor="let item of collaborationItems">
    <div *ngIf="item.id === 'collaborator'" class="dropdown">
      <button class="btn" [class.active]="activePanel === 'collaborator'" [title]="item.title" [attr.aria-label]="item.title" type="button" (click)="onCollabDropdownClick($event)">
        <i class="bi bi-{{item.icon}}"></i>
      </button>
      <ul class="dropdown-menu" [class.show]="activeDropdown === 'collaborator'">
        <li *ngFor="let option of item.options">
          <a class="dropdown-item" (click)="handleCollabOption(option)">{{ option }}</a>
        </li>
      </ul>
    </div>
    <button *ngIf="item.id !== 'collaborator'" class="btn" [class.active]="activePanel === item.id" [title]="item.title" [attr.aria-label]="item.title" (click)="onPanelClick(item.id)">
      <i class="bi bi-{{item.icon}}"></i>
    </button>
  </ng-container>
</div>
