<div class="ai-panel">
  <div class="ai-header">
    <div class="title">AI Assistant</div>
  </div>

  <div class="chat-container">
    <div class="messages" #messagesContainer>
      <div *ngFor="let message of messages" class="message-row" [ngClass]="message.type">
        <div class="avatar">
          <span>{{ message.type === 'user' ? 'You' : 'AI' }}</span>
        </div>
        <div class="bubble">
          <div class="message-content">{{ message.content }}</div>
          <div *ngIf="message.context" class="context-info">{{ message.context }}</div>
        </div>
      </div>
      <div *ngIf="isProcessing" class="message-row assistant">
        <div class="avatar assistant">
          <span>AI</span>
        </div>
        <div class="bubble thinking">
          <div class="thinking-dots">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="input-container">
    <div class="selected-contexts-container">
      <div *ngFor="let context of selectedContexts" class="context-chip">
        <i class="fas" [ngClass]="{'fa-folder': isFolder(context), 'fa-file-code': !isFolder(context)}"></i>
        <span>{{ getContextName(context) }}</span>
        <button class="icon-btn close-context" (click)="removeContext(context)" title="Remove context">
          <i class="fas fa-times" aria-hidden="true"></i>
        </button>
      </div>
    </div>
    <div class="input-bottom-row">
      <button (click)="toggleContextPicker()" class="context-btn" title="Add file context">
        <i class="fas fa-paperclip" aria-hidden="true"></i>
      </button>
      <textarea 
        [(ngModel)]="userInput" 
        placeholder="Ask me anything..."
        (keydown)="handleKeydown($event)"
        (input)="autoResizeTextarea($event)"
        rows="1"
        class="highlighted-input"
        aria-label="Message input"
      ></textarea>
      <div class="input-actions">
        <select [(ngModel)]="selectedModel" class="model-select" title="Select AI model">
          <option value="claude sonnet 4.5">claude sonnet 4</option>
          <option value="Cortext">Cortext</option>
            </select>
            <button (click)="sendMessage()" [disabled]="!userInput.trim() || isProcessing" class="send-btn" title="Send message">
              <i class="fas fa-paper-plane" aria-hidden="true"></i>
            </button>
          </div>
        </div>
        <div class="context-picker" *ngIf="showContextPicker">
          <div class="picker-header">
            <span>Select Context</span>
            <button class="icon-btn" (click)="closeContextPicker()" title="Close context picker">
              <i class="fas fa-times" aria-hidden="true"></i>
            </button>
          </div>
          <div class="picker-list">
            <div *ngFor="let item of flatList; trackBy: trackByPath" 
             class="picker-item" 
             (click)="selectAndAddContext(item.path)">
          <div class="item-content" [style.paddingLeft.px]="item.depth * 12">
            <i class="fas" [ngClass]="item.node.type === 'folder' ? 'fa-folder' : 'fa-file-code'"></i>
            <span [class.folder]="item.node.type === 'folder'">{{ item.node.name }}</span>
          </div>
        </div>
          </div>
        </div>
      </div>
    </div>
