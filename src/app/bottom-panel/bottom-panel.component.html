<div class="bottom-panel-container" [class.show]="activePanel !== null">
  <div class="panel-resize-bar" (mousedown)="startResize($event)">
    <span class="resize-arrow">⋮</span>
  </div>
  <div class="panel-content">
    <div class="content-wrapper" *ngIf="activePanel !== 'output'">
      {{ getPanelContent(activePanel) }}
    </div>
    <div *ngIf="activePanel === 'output'" class="output-wrapper">
      <app-output-panel></app-output-panel>
    </div>
  </div>
</div>

<div class="bottom-toolbar">
  <div class="btn-group">
    <ng-container *ngFor="let item of bottomToolbarItems">
      <button class="btn btn-tool" [title]="item.title" (click)="togglePanel(item.id)"
        [class.active]="activePanel === item.id">
        <i class="bi bi-{{item.icon}}"></i>
        <span class="tool-label">{{item.label}}</span>
      </button>
    </ng-container>
  </div>
</div>
